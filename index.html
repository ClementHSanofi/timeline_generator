<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Generator</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="sidebar-wrapper">
        <div id="sideform">
            <div id="sideform-header">
                <h1>Timeline Generator</h1>
            </div>
            <div id="event-form-container">
                <form id="event-form"></form>
                <button id="add-event-btn" type="button">Ajouter un événement</button>
                <button type="submit" form="event-form">Générer la timeline</button>
                <button id="clear-events-btn" type="button">Réinitialiser</button>
            </div>
        </div>
        <button class="toggle" id="sideform-toggle">MonIcon</button>
    </div>

    <main>
        <div id="timeline-container">
            <div id="timeline"></div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
