<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Generator</title>
</head>
<body>
    <section id="timeline-container">
        <div id="timeline"></div>
    </section>
    <section id="event-form-container">
        <form id="event-form"></form>
        <button id="add-event-btn" type="button">Ajouter un événement</button>
        <button type="submit" form="event-form">Générer la timeline</button>
        <button id="clear-events-btn" type="button">Rénitialiser</button>
    </section>
    <script type="module" src="js/form.js"></script>
</body>
</html>
