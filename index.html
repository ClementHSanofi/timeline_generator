<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Generator</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="sidebar-wrapper">
        <div id="sideform">
            <div id="sideform-header">
                <h1>Timeline Generator</h1>
            </div>
            <div id="event-form-container">
                <form id="event-form"></form>
                <div class="buttons-form">
                    <button id="add-event-btn" class="add-event-button" type="button">Ajouter un événement</button>
                    <button type="submit" form="event-form" class="generate-button">Générer la timeline</button>
                    <button id="clear-events-btn" class="clear-button" type="button">Réinitialiser</button>
                </div>
                <div class="buttons-data">
                    <button id="export-json-btn" class="export-json-button" type="button">Exporter</button>
                    <button id="import-json-btn" class="import-json-button" type="button">Importer</button>
                </div>
            </div>
        </div>
        <button class="toggle" id="sideform-toggle"><img src="./assets/close-icon.svg" class="sidebar-icon" alt="Toggle"></button>
    </div>

    <main>
        <div id="timeline-container">
            <div id="timeline"></div>
        </div>
        <button id="export-pdf-btn" class="export-button">Exporter en PDF</button>
    </main>

    <script type="module" src="js/app.js"></script>
    <script src="libs/html2canvas.min.js"></script>
    <script src="libs/jspdf.umd.min.js"></script>
</body>
</html>
